<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>G30S/PKI - Sejarah Indonesia</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #090909;
            color: white;
            line-height: 1.7;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 6%;

            background: #0d0d0d;
            border-bottom: 1px solid #292929;
        }

        .logo {
            color: white;
            text-decoration: none;

            font-size: 21px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            color: #d62828;
        }

        .menu {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .menu a {
            color: #aaa;
            text-decoration: none;

            padding: 7px 10px;

            font-size: 13px;

            transition: 0.3s;
        }

        .menu a:hover {
            color: #e63946;
        }


        /* =========================
           UMUM
        ========================= */

        section {
            scroll-margin-top: 80px;
        }

        .container {
            width: 88%;
            max-width: 1100px;
            margin: auto;
        }

        .section {
            padding: 90px 0;
        }

        .label {
            color: #e63946;

            font-size: 12px;
            font-weight: bold;

            letter-spacing: 3px;
        }

        .title {
            font-size: clamp(40px, 7vw, 70px);

            line-height: 1.05;

            margin: 10px 0 20px;
        }

        .description {
            color: #999;
            max-width: 700px;
        }


        /* =========================
           BERANDA
        ========================= */

        #beranda {
            min-height: 90vh;

            display: flex;
            align-items: center;

            background:
                radial-gradient(
                    circle at 80% 40%,
                    rgba(150, 0, 0, 0.35),
                    transparent 35%
                ),
                #090909;
        }

        .hero-content {
            max-width: 780px;
        }

        .badge {
            display: inline-block;

            padding: 7px 15px;

            border: 1px solid #7f1d1d;
            border-radius: 50px;

            color: #ff7777;

            font-size: 12px;
            letter-spacing: 2px;

            margin-bottom: 25px;
        }

        .hero-title {
            font-size: clamp(65px, 14vw, 150px);

            line-height: 0.85;

            letter-spacing: -6px;

            margin-bottom: 30px;
        }

        .hero-title span {
            color: #d62828;
        }

        .hero-text {
            color: #aaa;
            font-size: 17px;

            max-width: 650px;

            margin-bottom: 30px;
        }

        .button {
            display: inline-block;

            padding: 13px 22px;

            background: #c1121f;
            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-weight: bold;

            transition: 0.3s;
        }

        .button:hover {
            background: #e63946;
            transform: translateY(-2px);
        }


        /* =========================
           TENTANG
        ========================= */

        .about-grid {
            display: grid;

            grid-template-columns: 1.2fr 0.8fr;

            gap: 20px;

            margin-top: 45px;
        }

        .box {
            background: #141414;

            border: 1px solid #292929;

            border-radius: 15px;

            padding: 30px;
        }

        .box p {
            color: #aaa;
            margin-bottom: 15px;
        }

        .warning {
            border-left: 4px solid #c1121f;
        }

        .warning h3 {
            color: #e63946;
            margin-bottom: 10px;
        }


        /* =========================
           KARTU
        ========================= */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-top: 45px;
        }

        .card {
            background: #141414;

            border: 1px solid #292929;

            border-radius: 15px;

            padding: 28px;

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);

            border-color: #a51d1d;
        }

        .number {
            color: #741414;

            font-size: 40px;

            font-weight: bold;
        }

        .card h3 {
            margin: 8px 0;
        }

        .card p {
            color: #999;

            font-size: 14px;
        }


        /* =========================
           TOKOH
        ========================= */

        .tokoh-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

            margin-top: 45px;
        }

        .tokoh-card {
            display: block;

            background: #141414;

            border: 1px solid #292929;

            border-radius: 15px;

            padding: 25px;

            color: white;

            text-decoration: none;

            transition: 0.3s;
        }

        .tokoh-card:hover {
            transform: translateY(-5px);

            border-color: #c1121f;

            background: #181818;
        }

        .tokoh-number {
            color: #a51d1d;

            font-size: 12px;

            letter-spacing: 2px;

            font-weight: bold;
        }

        .tokoh-card h3 {
            font-size: 22px;

            margin: 5px 0;
        }

        .tokoh-card p {
            color: #888;

            font-size: 14px;
        }

        .lihat {
            display: block;

            color: #e63946;

            margin-top: 12px;

            font-size: 13px;

            font-weight: bold;
        }


        /* =========================
           DETAIL TOKOH
        ========================= */

        .detail {
            max-width: 800px;

            margin: auto;
        }

        .detail-number {
            color: #581414;

            font-size: 80px;

            font-weight: bold;

            line-height: 1;
        }

        .detail h2 {
            font-size: clamp(40px, 8vw, 70px);

            line-height: 1;

            margin: 10px 0;
        }

        .position {
            color: #e63946;

            margin-bottom: 30px;
        }

        .detail-box {
            background: #141414;

            border: 1px solid #292929;

            border-radius: 15px;

            padding: 28px;

            margin-bottom: 18px;
        }

        .detail-box h3 {
            color: #e63946;

            margin-bottom: 8px;
        }

        .detail-box p {
            color: #aaa;
        }

        .back {
            display: inline-block;

            color: #aaa;

            text-decoration: none;

            margin-bottom: 30px;
        }

        .back:hover {
            color: #e63946;
        }


        /* =========================
           KRONOLOGI
        ========================= */

        .timeline {
            max-width: 800px;

            margin-top: 50px;
        }

        .timeline-item {
            position: relative;

            padding:
                0 0 45px 35px;

            border-left:
                2px solid #681818;
        }

        .timeline-item::before {
            content: "";

            position: absolute;

            left: -7px;
            top: 0;

            width: 12px;
            height: 12px;

            border-radius: 50%;

            background: #d62828;
        }

        .date {
            color: #e63946;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 1px;
        }

        .timeline-item h3 {
            margin: 5px 0;
        }

        .timeline-item p {
            color: #999;
        }


        /* =========================
           DAMPAK
        ========================= */

        .impact-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

            margin-top: 45px;
        }

        .impact {
            background: #141414;

            border: 1px solid #292929;

            border-radius: 15px;

            padding: 28px;
        }

        .impact h3 {
            color: #e63946;

            margin-bottom: 8px;
        }

        .impact p {
            color: #999;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding: 40px 20px;

            background: #050505;

            border-top: 1px solid #222;
        }

        footer p {
            color: #666;

            font-size: 13px;
        }


        /* =========================
           RESPONSIVE HP
        ========================= */

        @media (max-width: 800px) {

            nav {
                flex-direction: column;
                gap: 8px;

                padding: 12px 3%;
            }

            .menu {
                width: 100%;
            }

            .menu a {
                font-size: 10px;
                padding: 5px;
            }

            .about-grid,
            .cards,
            .tokoh-grid,
            .impact-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 90%;
            }

            .section {
                padding: 65px 0;
            }

        }

    </style>
</head>
