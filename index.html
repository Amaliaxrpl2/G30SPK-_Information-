<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>G30S/PKI — Sejarah Indonesia</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: #ffffff;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        section {
            scroll-margin-top: 90px;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 999;

            background: rgba(8, 8, 8, 0.96);
            border-bottom: 1px solid #222;

            padding: 18px 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo span {
            color: #d71920;
        }

        .nav-menu {
            display: flex;
            gap: 8px;
        }

        .nav-menu a {
            color: #999;
            font-size: 14px;

            padding: 9px 13px;
            border-radius: 7px;

            transition: 0.25s;
        }

        .nav-menu a:hover {
            color: white;
            background: #1b1b1b;
        }

        .nav-menu a:active {
            background: #c1121f;
            color: white;
        }


        /* =========================
           UMUM
        ========================= */

        .container {
            width: 86%;
            max-width: 1100px;
            margin: auto;
        }

        .section {
            padding: 100px 0;
        }

        .eyebrow {
            color: #e63946;

            font-size: 12px;
            font-weight: bold;

            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .section-title {
            font-size: clamp(40px, 7vw, 75px);
            line-height: 1;

            margin: 12px 0 20px;
        }

        .section-description {
            color: #999;
            max-width: 700px;
        }


        /* =========================
           HERO
        ========================= */

        #beranda {
            min-height: 92vh;

            display: flex;
            align-items: center;

            background:
                radial-gradient(
                    circle at 80% 35%,
                    rgba(180, 0, 0, 0.35),
                    transparent 35%
                ),
                #080808;
        }

        .hero {
            max-width: 900px;
        }

        .hero-small {
            display: inline-block;

            color: #e63946;

            border: 1px solid #6d151b;
            border-radius: 50px;

            padding: 7px 15px;

            font-size: 11px;
            letter-spacing: 2px;

            margin-bottom: 25px;
        }

        .hero-title {
            font-size: clamp(70px, 14vw, 150px);

            line-height: 0.82;

            letter-spacing: -8px;

            margin-bottom: 35px;
        }

        .hero-title span {
            color: #d71920;
        }

        .hero-description {
            max-width: 680px;

            color: #aaa;

            font-size: 18px;

            margin-bottom: 30px;
        }

        .hero-button {
            display: inline-block;

            background: #c1121f;
            color: white;

            padding: 15px 25px;

            border-radius: 8px;

            font-weight: bold;

            transition: 0.25s;
        }

        .hero-button:hover {
            background: #e63946;
            transform: translateY(-3px);
        }


        /* =========================
           TENTANG
        ========================= */

        .about-grid {
            display: grid;
            grid-template-columns: 1.4fr 0.6fr;

            gap: 20px;

            margin-top: 45px;
        }

        .about-card {
            background: #121212;

            border: 1px solid #292929;

            border-radius: 18px;

            padding: 30px;
        }

        .about-card p {
            color: #999;
            margin-bottom: 15px;
        }

        .about-card p:last-child {
            margin-bottom: 0;
        }

        .about-warning {
            border-top: 3px solid #c1121f;
        }

        .about-warning h3 {
            color: #e63946;
            margin-bottom: 10px;
        }


        /* =========================
           LATAR BELAKANG
        ========================= */

        .selection-header {
            margin-top: 75px;
        }

        .selection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 18px;

            margin-top: 40px;
        }

        .selection-card {
            background: #121212;

            border: 1px solid #292929;

            border-radius: 18px;

            padding: 28px;

            transition: 0.25s;
        }

        .selection-card:hover {
            transform: translateY(-5px);
            border-color: #9d1b22;
        }

        .selection-number {
            color: #71151a;

            font-size: 42px;
            font-weight: bold;
        }

        .selection-card h3 {
            margin: 5px 0 10px;
        }

        .selection-card p {
            color: #888;
            font-size: 14px;
        }


        /* =========================
           TOKOH
        ========================= */

        .tokoh-section {
            background: #0b0b0b;
        }

        .tokoh-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 18px;

            margin-top: 45px;
        }

        .tokoh-card {
            display: block;

            background: #121212;

            border: 1px solid #292929;

            border-radius: 18px;

            padding: 28px;

            transition: 0.25s;
        }

        .tokoh-card:hover {
            transform: translateY(-5px);

            border-color: #c1121f;

            background: #161616;
        }

        .tokoh-card:active {
            transform: scale(0.98);
        }

        .tokoh-label {
            color: #e63946;

            font-size: 11px;
            font-weight: bold;

            letter-spacing: 2px;
        }

        .tokoh-card h3 {
            font-size: 24px;
            margin: 7px 0;
        }

        .tokoh-card p {
            color: #888;
            font-size: 14px;
        }

        .tokoh-link {
            display: block;

            color: #e63946;

            font-size: 13px;
            font-weight: bold;

            margin-top: 15px;
        }


        /* =========================
           DETAIL TOKOH
        ========================= */

        .detail-section {
            border-top: 1px solid #191919;
        }

        .detail {
            max-width: 850px;
        }

        .back-button {
            display: inline-block;

            color: #999;

            padding: 9px 0;

            margin-bottom: 25px;
        }

        .back-button:hover {
            color: #e63946;
        }

        .detail-number {
            color: #68151a;

            font-size: 80px;
            font-weight: bold;

            line-height: 0.9;
        }

        .detail h2 {
            font-size: clamp(38px, 7vw, 68px);

            line-height: 1;

            margin: 12px 0 8px;
        }

        .detail-position {
            color: #e63946;

            margin-bottom: 30px;
        }

        .detail-box {
            background: #121212;

            border: 1px solid #292929;

            border-radius: 16px;

            padding: 27px;

            margin-bottom: 16px;
        }

        .detail-box h3 {
            color: #e63946;

            margin-bottom: 8px;
        }

        .detail-box p {
            color: #999;
        }


        /* =========================
           KRONOLOGI
        ========================= */

        .timeline {
            max-width: 850px;

            margin-top: 45px;
        }

        .timeline-item {
            position: relative;

            border-left: 2px solid #5f161b;

            padding:
                0 0 45px 32px;
        }

        .timeline-item:last-child {
            border-left-color: transparent;
        }

        .timeline-item::before {
            content: "";

            position: absolute;

            left: -7px;
            top: 0;

            width: 12px;
            height: 12px;

            background: #d71920;

            border-radius: 50%;
        }

        .timeline-date {
            color: #e63946;

            font-size: 12px;
            font-weight: bold;

            letter-spacing: 1px;
        }

        .timeline-item h3 {
            margin: 6px 0 8px;
        }

        .timeline-item p {
            color: #999;
        }


        /* =========================
           DAMPAK
        ========================= */

        .impact-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 18px;

            margin-top: 45px;
        }

        .impact-card {
            background: #121212;

            border: 1px solid #292929;

            border-radius: 18px;

            padding: 28px;
        }

        .impact-card h3 {
            color: #e63946;

            margin-bottom: 8px;
        }

        .impact-card p {
            color: #999;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            background: #050505;

            border-top: 1px solid #222;

            padding: 45px 20px;
        }

        footer h3 {
            letter-spacing: 2px;
        }

        footer span {
            color: #d71920;
        }

        footer p {
            color: #666;

            font-size: 13px;
        }


        /* =========================
           RESPONSIVE HP
        ========================= */

        @media (max-width: 800px) {

            .navbar {
                flex-direction: column;
                gap: 12px;

                padding: 14px 3%;
            }

            .nav-menu {
                width: 100%;

                overflow-x: auto;

                justify-content: flex-start;

                padding-bottom: 3px;
            }

            .nav-menu a {
                flex: 0 0 auto;

                font-size: 12px;

                padding: 9px 11px;
            }

            .container {
                width: 90%;
            }

            .section {
                padding: 70px 0;
            }

            .about-grid,
            .selection-grid,
            .tokoh-grid,
            .impact-grid {
                grid-template-columns: 1fr;
            }

            .hero-title {
                letter-spacing: -4px;
            }

            .hero-description {
                font-size: 16px;
            }

            .detail-number {
                font-size: 60px;
            }
        }

    </style>
</head>
